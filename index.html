<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ETHER" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#08080A" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("ether-theme") || "system";
          var dark = choice === "dark" || (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- SEO. Description matches HERO_TAGLINE in src/content/copy.ts. -->
    <title>Ether</title>
    <meta name="description" content="Ether is a place for people to share work they made and find each other." />
    <meta name="author" content="ETHER" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://etherbylcove.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ether" />
    <meta property="og:description" content="Ether is a place for people to share work they made and find each other." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://etherbylcove.com" />
    <meta property="og:image" content="https://etherbylcove.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="ETHER" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ether" />
    <meta name="twitter:description" content="Ether is a place for people to share work they made and find each other." />
    <meta name="twitter:image" content="https://etherbylcove.com/og.png" />
  </head>

  <body>
    <noscript>
      <p>Ether is a place for people to share work they made and find each other.</p>
      <p><a href="/waitlist">Join</a></p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
