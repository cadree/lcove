<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Ether · Payout setup</title></head>
<body style="background:#080808;color:#fff;font:18px system-ui;padding:32px">
  <p id="status" role="status">Opening secure payout setup…</p>
  <script>
    // The one-use link stays in the fragment, so it never reaches web logs.
    try {
      const url = new URL(decodeURIComponent(location.hash.slice(1)));
      history.replaceState(null, "", location.pathname);
      if (url.protocol !== "https:" || url.hostname !== "connect.stripe.com" || url.username || url.password) throw new Error();
      location.replace(url.href);
    } catch {
      document.getElementById("status").textContent = "Return to Ether and tap Connect payouts to get a fresh setup link.";
    }
  </script>
</body>
</html>
