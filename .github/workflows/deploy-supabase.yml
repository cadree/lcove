# Deploys Edge Functions to ether-prod. Manual only.
# Does not run SQL, migrations, or any database connection.
#
# supabase/config.toml sets verify_jwt per function. CLI 2.121.0 applies that
# value when --no-verify-jwt is omitted. Passing the flag would turn JWT
# checks off for every function named in that one command.

name: Deploy Supabase functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: all, or a comma-separated list of function names
        required: true
        default: all
        type: string
      dry_run:
        description: Dry run. Print the function list and verify_jwt flags, then stop
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-supabase-ether-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FUNCTIONS: ${{ inputs.functions }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'aykopqinnnssxdhxqruo' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plan functions and verify_jwt
        run: python3 scripts/function-deploy-plan.py

      - name: Require access token
        if: inputs.dry_run == false
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - name: Set up Supabase CLI
        if: inputs.dry_run == false
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Set function secrets
        if: inputs.dry_run == false
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLE_PASS_TYPE_ID: ${{ secrets.APPLE_PASS_TYPE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_URL: ${{ secrets.APP_URL }}
          GOOGLE_WALLET_ISSUER_ID: ${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
          GOOGLE_WALLET_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_WALLET_SERVICE_ACCOUNT_KEY }}
          INTERNAL_FUNCTION_SECRET: ${{ secrets.INTERNAL_FUNCTION_SECRET }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          LOVABLE_SEND_URL: ${{ secrets.LOVABLE_SEND_URL }}
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          cleanup() { rm -f "$secret_file"; }
          trap cleanup EXIT
          python3 scripts/function-deploy-plan.py --write-env "$secret_file"
          if [ ! -s "$secret_file" ]; then
            echo "No function secrets are set in GitHub. Skipping supabase secrets set."
            exit 0
          fi
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$secret_file"

      - name: Deploy functions
        if: inputs.dry_run == false
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          names_file="$(mktemp)"
          trap 'rm -f "$names_file"' EXIT
          python3 scripts/function-deploy-plan.py --names > "$names_file"
          mapfile -t names < "$names_file"
          if [ "${#names[@]}" -eq 0 ]; then
            echo "No functions selected."
            exit 1
          fi
          echo "Deploying ${#names[@]} functions to ${PROJECT_REF} with --use-api."
          supabase functions deploy "${names[@]}" --project-ref "$PROJECT_REF" --use-api --jobs 4
