name: Prepare music web update
on:
  pull_request:
    branches: [cursor/ether-combined]
    paths: ['.github/workflows/music-web-update.yml']
permissions:
  contents: write
jobs:
  bundle:
    if: github.head_ref == 'fix/music-free-and-payouts' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://aykopqinnnssxdhxqruo.supabase.co
          VITE_SUPABASE_PROJECT_ID: aykopqinnnssxdhxqruo
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5a29wcWlubm5zc3hkaHhxcnVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjExOTAsImV4cCI6MjEwNzkzNzE5MH0.dnP2VHqVodlq9BwJUr5zhNqfeIohpWjsyfUOR65rdX4
      - name: Package existing native builds
        run: |
          node scripts/live-update-bundle.mjs --skip-build --native 202611222244 --version 1.0.5-web.6
          node scripts/live-update-bundle.mjs --skip-build --native 202611231300 --version 1.0.6-web.2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/native-updates
          git commit -m "Package free music and payout fixes for current iPhone builds"
          git push
