# One-off read of public.ether_schema_migrations on ether-prod.
# Prints filenames only. Does not write SQL. Removed after the list is captured.
name: List ether schema migrations

on:
  push:
    branches:
      - cursor/prod-migration-files-1414

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recorded migration filenames
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is empty"
            exit 1
          fi
          python3 - << 'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ["SUPABASE_ACCESS_TOKEN"]
          body = json.dumps({
              "query": "select version from public.ether_schema_migrations order by version",
              "read_only": True,
          }).encode()
          req = urllib.request.Request(
              "https://api.supabase.com/v1/projects/aykopqinnnssxdhxqruo/database/query",
              data=body,
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read().decode()
                  status = resp.status
          except urllib.error.HTTPError as err:
              print("http", err.code)
              print(err.read().decode()[:2000])
              raise SystemExit(1)
          print("http", status)
          data = json.loads(raw)
          rows = data if isinstance(data, list) else data.get("result") or data.get("rows") or data
          if not isinstance(rows, list):
              print(json.dumps(data)[:2000])
              raise SystemExit(1)
          print("count", len(rows))
          for row in rows:
              version = row.get("version") if isinstance(row, dict) else row
              print(version)
          PY
